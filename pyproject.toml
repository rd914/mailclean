[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mailclean"
version = "0.1.0"
description = "Email cleanup CLI application with flexible query language"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "keyring>=24.0",
    "rich>=13.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
mailclean = "mailclean.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mailclean*"]
